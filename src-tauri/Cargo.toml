[package]
name = "velora-poker"
version = "0.1.0"
description = "Windows desktop poker HUD for PokerStars hand histories"
authors = ["Nuno Marques"]
license = "MIT"
repository = "https://github.com/nunomarques97/velora-poker"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "velora_poker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[features]
# PokerStars' TOS (per Hand2Note's own compliance manual, an approved HUD
# vendor) prohibits automatic player classification shown as a HUD color or
# label — VPIP/PFR-derived archetypes like "Maniac" or "Reg" the player never
# asked for. Manual per-player color overrides are explicitly allowed and are
# NOT gated by this flag; see classification::resolve_for_player.
#
# This flag keeps the automatic classifier's output out of serialization (and
# therefore out of the frontend) unless explicitly enabled. Builds meant for
# PokerStars play should be compiled WITHOUT it. Do not enable it by default,
# and do not remove this gate as "dead code": it is load-bearing for ToS
# compliance, not leftover cruft.
auto-classification = []

# The player-description engine produces prescriptive advice ("3-bet him
# wider"), not descriptive labeling like `auto-classification`, so it carries
# a higher ToS/account risk and gets its own flag rather than reusing that one.
# Off by default. When off, `description_rules`'s output is simply empty, same
# as `auto-classification`'s flag-off behavior.
strategic-analysis = []

