<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velora overlay QA harness</title>
    <!--
      QA-only page (dev server only, never bundled: vite.config.ts builds
      index.html and overlay.html). It renders the real overlay (src/overlay)
      over a drawn PokerStars-like table, with the Tauri invoke/event boundary
      mocked in memory. The table is drawn from seatLayout.ts's own ASSUMED
      geometry, so it checks the HUD against that geometry, not against a live
      client.

      Query parameters:
        table=1            required by the overlay (its table id)
        max=6|9            table size (default 6)
        frame=hero|absolute  Auto-Center on (hero, default) or off
        model=compact|badge  HUD profile model (default compact)
        engine=1           opponents carry an engine payload (strategic-analysis
                           build): chip tags, hover card, drawer reads
        action=drag|cancel|click|external   optional scripted interaction
               hover|hoverall|leave|nativeleave|esc|focus|hoverdrag|hoverclick|
               refresh|drop|outoforder          hover-card actions (engine=1)
        seat=<key>         seat key the action targets (default 2)
        dx=<px>&dy=<px>    drag distance (default 40, 14)
        scroll=end         with action=click: scroll the drawer to its end

      Results, written to <body> data attributes once the page settles
      (data-qa-ready="1"):
        data-qa-chips              chips rendered
        data-qa-overlap            chip pairs that overlap
        data-qa-intersections      chip x protected-zone overlaps (seatLayout.protectedZones)
        data-qa-opp-hole-intersections  chip x opponents' hole cards (avoided by default)
        data-qa-plate-intersections  chip x another seat's name plate (never by default)
        data-qa-save-count         save_seat_position calls
        data-qa-last-save          last save_seat_position arguments, JSON
        data-qa-hot-zones          zones in the last set_overlay_hot_zones call
        data-qa-max-zone-fraction  largest hot zone, as a fraction of the window area
        data-qa-panel              1 when the detail panel is open
        data-qa-action-result      what the scripted action observed
        data-qa-min-font-px        smallest chip font size, in CSS px
        data-qa-tags               chips showing a tag
        data-qa-min-tag-font-px    smallest tag font size, in CSS px
        data-qa-tag-labels         chips whose accessible name carries their tag
        data-qa-samples            chips showing the sample behind their tag
        data-qa-min-sample-font-px smallest sample font size, in CSS px
        data-qa-sample-labels      chips whose accessible name states their sample in words
        data-qa-card               1 when a hover card is open (placed and visible)
        data-qa-card-reads         reads on the open card
        data-qa-card-text          the open card's text
        data-qa-card-violations    open card x (protected zones, any seat's hole cards, own chip, window edge)
        data-qa-card-hole          open card x any seat's hole cards (hero or opponent; must be 0)
        data-qa-card-hot           1 when the card is clickable or a hot zone
        data-qa-listeners          JSON: live event listeners per event
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #101418;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #root {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }
      #table {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #1d2a33 0%, #0e1317 75%);
      }
      #table > div {
        position: absolute;
        box-sizing: border-box;
      }
      .felt {
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 45%, #2f7d4a 0%, #1f5c35 70%, #174a2a 100%);
        border: 0.9vh solid #3a2a1c;
        box-shadow: inset 0 0 2vh rgba(0, 0, 0, 0.45);
      }
      .plate {
        background: #1a1d22;
        border: 1px solid #50565f;
        border-radius: 0.8vh;
        color: #e9edf2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 2.8vh;
        line-height: 1.15;
        overflow: hidden;
        white-space: nowrap;
      }
      .plate b {
        font-weight: 600;
      }
      .plate span {
        color: #9fe39a;
      }
      .plate.hero {
        border-color: #d9c35c;
      }
      .cards {
        display: flex;
        justify-content: center;
        gap: 2%;
      }
      .card {
        height: 100%;
        aspect-ratio: 5 / 7;
        border-radius: 0.6vh;
        background: #f7f7f2;
        border: 1px solid #999;
        color: #111;
        font-weight: 700;
        font-size: 3.2vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 0.3vh;
        box-sizing: border-box;
      }
      .card.red {
        color: #c0262d;
      }
      .card.back {
        background: repeating-linear-gradient(45deg, #9b1c24 0 3px, #7d141b 3px 6px);
        border-color: #f0e6e6;
      }
      .board {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 4%;
      }
      .pot {
        color: #f2f2f2;
        font-size: 2.8vh;
        font-weight: 600;
      }
      .boardCards {
        display: flex;
        gap: 2%;
        height: 58%;
        justify-content: center;
        width: 100%;
      }
      .bet {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4%;
        color: #fff;
        font-size: 2.6vh;
      }
      .bet i {
        display: block;
        height: 62%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #d6412f;
        border: 0.4vh dashed #fff;
        box-sizing: border-box;
      }
      .actions {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6%;
        padding: 0 2% 3% 0;
      }
      .slider {
        height: 22%;
        border-radius: 0.6vh;
        background: #2b3036;
        border: 1px solid #555;
      }
      .buttons {
        display: flex;
        gap: 3%;
        height: 48%;
      }
      .buttons div {
        flex: 1;
        border-radius: 0.8vh;
        background: linear-gradient(#b3261e, #7e1510);
        color: #fff;
        font-size: 3.2vh;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e0a09a;
      }
      .ghost {
        border: 1px dashed #ffd84a;
        border-radius: 4px;
      }
    </style>
    <script>
      // In-memory stand-in for the Tauri runtime: the invoke boundary and the
      // event plugin, so the unmodified overlay code runs in a plain browser.
      (function () {
        const params = new URLSearchParams(location.search);
        const max = params.get("max") === "9" ? 9 : 6;
        const frame = params.get("frame") === "absolute" ? "absolute" : "hero";
        const model = params.get("model") === "badge" ? "badge" : "compact";
        const heroSeat = max === 9 ? 7 : 4;

        // Realistic spread: two players under min_hands (25), one wide
        // 4-digit sample, two automatic archetypes, one manual colour.
        const roster = [
          ["Hero_Nuno", 2140, 23, 19, 8, null],
          ["fishy_mcfold", 12, 58, 6, 2, null],
          ["TightTony", 318, 14, 12, 5, ["nittyRock", "Nitty / Rock", "#5b7a99"]],
          ["AggroAnna77", 1204, 31, 27, 11, ["looseAggressive", "Loose Aggressive", "#e0954f"]],
          ["xX_river_Xx", 7, 43, 14, null, null],
          ["calldown_carl", 96, 47, 9, 3, ["loosePassive", "Loose Passive", "#d9b44a"]],
          ["GrinderGus", 540, 21, 18, 7, null],
          ["M4ster_Bluff", 77, 36, 30, 14, ["maniac", "Maniac", "#e0524f"]],
          ["RockSolid_R", 44, 11, 9, 2, null],
        ];
        const players = [];
        for (let seat = 1; seat <= max; seat++) {
          // Seat order: the hero first, then clockwise.
          const offset = (seat - heroSeat + max) % max;
          const [name, hands, vpip, pfr, threeBet, arche] = roster[offset];
          const override = name === "calldown_carl";
          const engine = params.get("engine") === "1" && offset !== 0 ? engineFor(name, hands) : null;
          players.push({
            id: `p${seat}`,
            name,
            hands,
            stats: {
              vpip, pfr, threeBet,
              foldToThreeBet: 55, cBet: 62, foldToCBet: 41, aggressionFactor: 2.4, wtsd: 27, wsd: 51,
            },
            // As commands.rs: with an engine, the descriptions are its reads.
            descriptions: engine ? engine.reads : [],
            note: null,
            classification: arche
              ? { classification: arche[0], label: arche[1], color: arche[2], isOverride: override, available: true }
              : { classification: "unknown", label: "Unknown", color: "#6b7280", isOverride: false, available: true },
            seat,
            seatOffset: offset,
            engine,
          });
        }

        // The `strategic-analysis` payload (src/data/types.ts EnginePayload),
        // with tags from the spec vocabulary and wording of realistic length.
        // `sample` as rules.rs builds it: hands for VPIP-based, recency and
        // showdown reads, opportunities for the rest, none for a stack fact.
        function read(ruleId, family, tag, observation, advice, pct, n) {
          const tier = pct >= 75 ? "high" : pct >= 50 ? "medium" : "low";
          const hands = ruleId === "pf.vpip.low" || family === "recency" || family === "showdown";
          return {
            ruleId, category: "exploit", observation, advice,
            confidencePct: pct, confidenceTier: tier, scenarioId: "P06", family, tag, score: pct / 100,
            evidence: [{ statName: ruleId, value: 61, opportunities: n, hits: Math.round(n * 0.61), shrunk: 58 }],
            sample: family === "stack" ? null : { count: n, unit: hands ? "hands" : "opportunities" },
          };
        }
        function engineFor(name, hands) {
          if (hands < 10) {
            // Too few hands for any read: no tag, an honest empty card.
            return { version: 1, tag: null, topReads: [], reads: [], context: null, headToHead: null,
              showdowns: [], sizingTells: [], recentForm: null, autoNotes: [] };
          }
          const byName = {
            fishy_mcfold: [read("pf.limp.high", "preflop", "LMP", "Limps 41% of the hands he enters.", "Isolate his limps wider, in position.", 52, 12)],
            TightTony: [
              read("pf.fold_to_3bet.high", "preflop", "F3B", "Folds to 72% of 3-bets (36/50).", "3-bet his opens wider as a bluff.", 81, 50),
              read("post.fold_to_cbet.high", "postflop", "FCB", "Folds to 64% of flop c-bets.", "C-bet small and often when he defends.", 68, 44),
            ],
            AggroAnna77: [
              read("pf.three_bet.high", "preflop", "3B+", "3-bets 14% of the time when you open.", "4-bet her lighter; call her 3-bets wider in position.", 77, 120),
              read("post.barrel.high", "postflop", "BRL", "Barrels the turn after 71% of her flop c-bets.", "Float flops wider and fold more turns to her second bet.", 63, 58),
            ],
            calldown_carl: [
              read("post.wtsd.high", "postflop", "STN", "Goes to showdown 38% of the hands he sees a flop.", "Value bet thinner and stop bluffing the river.", 71, 64),
              read("pf.cold_call.high", "preflop", "CC+", "Cold-calls 22% of opens.", "Raise bigger for value against his calls.", 55, 40),
            ],
            GrinderGus: [
              read("stack.push_fold", "stack", "12bb", "12bb effective: shoves or folds preflop.", "Call his shoves with a push/fold range, not a cash range.", 66, 30),
              read("pf.steal.high", "preflop", "STL", "Steals 48% from the cutoff and button.", "3-bet or reshove his late opens wider.", 60, 38),
            ],
            M4ster_Bluff: [
              read("recency.tilt", "recency", "TILT", "VPIP 58% in the last 30 hands, against 36% before.", "Value bet wider while he stays loose.", 58, 30),
              read("showdown.river_overbet_bluff", "showdown", "OVB", "Showed a bluff after a river overbet, 2 of 3 times.", "Call his river overbets more often.", 45, 3),
            ],
            RockSolid_R: [read("pf.vpip.low", "preflop", "NIT", "Plays 11% of hands; opens only the top of the range.", "Steal his blinds; fold to his 3-bets.", 62, 44)],
          };
          const reads = byName[name] ?? [];
          const top = reads.slice(0, 2);
          const lead = reads[0];
          const tag = lead
            ? { text: lead.tag, ruleId: lead.ruleId, source: lead.family === "recency" ? "tilt" : lead.family === "stack" ? "stack" : "read" }
            : null;
          return {
            version: 1, tag, topReads: top, reads, context: null,
            headToHead: { hands: 64, stats: [{ key: "three_bet_vs_hero_open", hits: 4, opportunities: 22, rawPct: 18.2, shrunkPct: 13.1 }] },
            showdowns: [{
              handId: "254119872004", playedAt: "2026-10-02T21:14:00Z", cards: "Jd 9d", board: "Ts 8h 2c 7d Ks",
              category: "Straight", result: "won",
              line: [
                { street: "preflop", action: "call", isAllIn: false, sizeBucket: null, potFraction: null },
                { street: "flop", action: "call", isAllIn: false, sizeBucket: null, potFraction: null },
                { street: "turn", action: "bet", isAllIn: false, sizeBucket: "medium", potFraction: 0.6 },
                { street: "river", action: "bet", isAllIn: false, sizeBucket: "overbet", potFraction: 1.4 },
              ],
              lastAggression: { street: "river", sizeBucket: "overbet", potFraction: 1.4, class: "value" },
            }],
            sizingTells: [{ bucket: "overbet", value: 3, bluff: 1, neither: 0, n: 4 }],
            recentForm: { window: 30, windowHits: 17, baselineOpportunities: hands, windowVpipPct: 56.7, baselineVpipPct: 36, z: 2.4, flag: name === "M4ster_Bluff" ? "tilt" : null, afterBigLoss: name === "M4ster_Bluff" },
            autoNotes: [{ id: 1, handId: "254119871233", kind: "limp_reraise_premium", text: "Limp-reraised preflop and showed AA.", createdAt: "2026-10-02T20:51:00Z", source: "auto" }],
          };
        }
        const profile = {
          id: model,
          name: model === "badge" ? "Badge" : "Compact",
          visualModel: model,
          statPages: [{ id: "main", label: "Main", statKeys: ["vpip", "pfr", "threeBet", "foldToThreeBet"] }],
          minHands: 25,
          isBuiltin: true,
        };

        const store = new Map(); // `${max}:${frame}` -> [{ seatKey, x, y }]
        const qa = (window.__QA__ = {
          max, frame, model, heroSeat, players, store,
          saves: [],
          hotZones: [],
          playerDelays: [], // ms, one per coming get_active_table_players call
          listeners: new Map(), // event -> Map(eventId -> callbackId)
          callbacks: new Map(),
          emit(event, payload) {
            const byId = qa.listeners.get(event);
            if (!byId) return;
            for (const [eventId, cbId] of byId) {
              const cb = qa.callbacks.get(cbId);
              if (cb) cb({ event, id: eventId, payload });
            }
          },
        });
        let nextId = 1;

        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
          unregisterListener(event, eventId) {
            qa.listeners.get(event)?.delete(eventId);
          },
        };
        window.__TAURI_INTERNALS__ = {
          transformCallback(callback) {
            const id = nextId++;
            qa.callbacks.set(id, callback);
            return id;
          },
          invoke: async (cmd, args = {}) => {
            switch (cmd) {
              case "plugin:event|listen": {
                const eventId = nextId++;
                if (!qa.listeners.has(args.event)) qa.listeners.set(args.event, new Map());
                qa.listeners.get(args.event).set(eventId, args.handler);
                return eventId;
              }
              case "plugin:event|unlisten":
                qa.listeners.get(args.event)?.delete(args.eventId);
                return null;
              case "get_active_table_players": {
                // The answer is what the table held when asked; `playerDelays`
                // holds it back, so an older answer can arrive after a newer one.
                const snapshot = structuredClone(players);
                const delay = qa.playerDelays.shift() ?? 0;
                if (delay) await new Promise((r) => setTimeout(r, delay));
                return snapshot;
              }
              case "get_active_hud_profile":
                return structuredClone(profile);
              case "get_active_table_max_players":
                return max;
              case "get_app_settings":
                return { onboardingComplete: true, pokerRoom: "pokerstars", overlayEnabled: true, autoCenterEnabled: frame === "hero" };
              case "get_seat_positions":
                return structuredClone(store.get(`${args.maxPlayers}:${args.frame}`) ?? []);
              case "save_seat_position": {
                qa.saves.push({ ...args });
                const key = `${args.maxPlayers}:${args.frame}`;
                const rows = (store.get(key) ?? []).filter((r) => r.seatKey !== args.seatKey);
                rows.push({ seatKey: args.seatKey, x: args.x, y: args.y });
                store.set(key, rows);
                // Like the backend: broadcast only after the write.
                setTimeout(() => qa.emit("seat-templates-changed", args.maxPlayers), 0);
                return null;
              }
              case "set_overlay_hot_zones":
                qa.hotZones = args.zones;
                return null;
              case "is_overlay_dismissed":
                return false;
              case "show_overlay":
                return null;
              default:
                console.warn("[qa-overlay] unmocked command", cmd, args);
                return null;
            }
          },
        };
      })();
    </script>
  </head>
  <body>
    <div id="table"></div>
    <div id="root"></div>
    <script type="module">
      import {
        ACTIONS_ZONE,
        BOARD_ZONE,
        defaultSeatAnchors,
        holeCardsRect as holeRect,
        protectedZones,
        seatPlateRect,
      } from "/src/overlay/seatLayout.ts";

      const qa = window.__QA__;
      const params = new URLSearchParams(location.search);
      const table = document.getElementById("table");
      const heroKey = qa.frame === "hero" ? 0 : qa.heroSeat;
      const anchors = defaultSeatAnchors(qa.max, qa.frame);
      const playerAt = (key) =>
        qa.players.find((p) => (qa.frame === "hero" ? p.seatOffset : p.seat) === key);

      function box(cls, rect, html = "") {
        const el = document.createElement("div");
        el.className = cls;
        el.style.left = `${rect.x * 100}%`;
        el.style.top = `${rect.y * 100}%`;
        el.style.width = `${rect.w * 100}%`;
        el.style.height = `${rect.h * 100}%`;
        el.innerHTML = html;
        table.appendChild(el);
        return el;
      }

      box("felt", { x: 0.1, y: 0.17, w: 0.8, h: 0.6 });
      const card = (text, red) => `<div class="card${red ? " red" : ""}">${text}</div>`;
      box(
        "board",
        BOARD_ZONE,
        `<div class="pot">Pot: 1,240</div><div class="boardCards">${card("A♠")}${card("K♥", true)}${card("7♦", true)}${card("7♣")}${card("2♠")}</div>`,
      );
      const zones = protectedZones(qa.max, qa.frame, heroKey);
      zones
        .filter((z) => z.kind === "bet")
        .filter((_, i) => i % 3 === 1)
        .forEach((z) => box("bet", z.rect, "<i></i>120"));
      for (const a of anchors) {
        const p = playerAt(a.seatKey);
        const hero = a.seatKey === heroKey;
        box(
          "cards",
          holeRect(a),
          hero ? card("Q♥", true) + card("Q♣") : '<div class="card back"></div><div class="card back"></div>',
        );
        box(`plate${hero ? " hero" : ""}`, seatPlateRect(a), `<b>${p ? p.name : "Empty"}</b><span>${(1000 + a.seatKey * 137).toLocaleString()}</span>`);
      }
      box(
        "actions",
        ACTIONS_ZONE,
        '<div class="slider"></div><div class="buttons"><div>Fold</div><div>Check</div><div>Bet 60</div></div>',
      );

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const W = () => window.innerWidth;
      const H = () => window.innerHeight;
      const chipButtons = () => [...document.querySelectorAll("[data-hud-chip] > button")];
      const pxRect = (r) => ({ x0: r.x * W(), y0: r.y * H(), x1: (r.x + r.w) * W(), y1: (r.y + r.h) * H() });
      const domRect = (el) => {
        const r = el.getBoundingClientRect();
        return { x0: r.left, y0: r.top, x1: r.right, y1: r.bottom };
      };
      const overlaps = (a, b) =>
        Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) > 0.5 && Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > 0.5;
      const chipFor = (key) => document.querySelector(`[data-seat-key="${key}"] > button`);

      function measure() {
        const chips = chipButtons().map(domRect);
        let overlap = 0;
        for (let i = 0; i < chips.length; i++)
          for (let j = i + 1; j < chips.length; j++) if (overlaps(chips[i], chips[j])) overlap++;
        let intersections = 0;
        for (const c of chips) for (const z of zones) if (overlaps(c, pxRect(z.rect))) intersections++;
        let oppHole = 0;
        for (const c of chips)
          for (const a of anchors) if (a.seatKey !== heroKey && overlaps(c, pxRect(holeRect(a)))) oppHole++;
        // A default chip may touch its own seat's plate, never another's.
        let plates = 0;
        for (const b of chipButtons()) {
          const own = b.parentElement.dataset.seatKey;
          for (const a of anchors) if (String(a.seatKey) !== own && overlaps(domRect(b), pxRect(seatPlateRect(a)))) plates++;
        }
        const area = W() * H();
        const maxZone = Math.max(0, ...qa.hotZones.map((z) => (z.width * z.height) / area));
        const fonts = chipButtons().map((b) => parseFloat(getComputedStyle(b).fontSize));
        const d = document.body.dataset;
        d.qaChips = String(chips.length);
        d.qaOverlap = String(overlap);
        d.qaIntersections = String(intersections);
        d.qaOppHoleIntersections = String(oppHole);
        d.qaPlateIntersections = String(plates);
        d.qaSaveCount = String(qa.saves.length);
        d.qaLastSave = qa.saves.length ? JSON.stringify(qa.saves[qa.saves.length - 1]) : "";
        d.qaHotZones = String(qa.hotZones.length);
        d.qaMaxZoneFraction = maxZone.toFixed(3);
        d.qaPanel = document.querySelector("aside") ? "1" : "0";
        d.qaMinFontPx = fonts.length ? String(Math.min(...fonts)) : "";
        const tagged = [...document.querySelectorAll("[data-hud-chip] > button[data-tag]")];
        const tagFonts = tagged.map((b) => parseFloat(getComputedStyle(b.firstElementChild).fontSize));
        d.qaTags = String(tagged.length);
        d.qaMinTagFontPx = tagFonts.length ? String(Math.min(...tagFonts)) : "";
        d.qaTagLabels = String(tagged.filter((b) => b.getAttribute("aria-label").includes(`tag ${b.dataset.tag}`)).length);
        // The sample sits inside the tag segment, as its second child.
        const sampled = [...document.querySelectorAll("[data-hud-chip] > button[data-sample]")];
        const sampleSpans = sampled.map((b) => b.firstElementChild?.firstElementChild).filter(Boolean);
        d.qaSamples = String(sampleSpans.filter((el, i) => el.textContent.trim() !== "" && sampled[i].dataset.sample).length);
        d.qaMinSampleFontPx = sampleSpans.length ? String(Math.min(...sampleSpans.map((el) => parseFloat(getComputedStyle(el).fontSize)))) : "";
        d.qaSampleLabels = String(sampled.filter((b) =>
          new RegExp(`based on ${Number(b.dataset.sample).toLocaleString("en-US")} (hands?|opportunit(y|ies))\\b`).test(b.getAttribute("aria-label"))).length);
        const listeners = {};
        for (const [event, byId] of qa.listeners) listeners[event] = byId.size;
        d.qaListeners = JSON.stringify(listeners);
        Object.assign(d, cardReport());
      }

      /** The open hover card, or null while none is open or it is not placed yet. */
      function openCard() {
        const el = document.querySelector("[data-hover-card]");
        return el && getComputedStyle(el).visibility !== "hidden" ? el : null;
      }

      /** What the open card covers; `owner` is its chip's button. */
      function cardReport(owner = document.querySelector("[data-hud-chip] > button[aria-describedby]")) {
        const card = openCard();
        if (!card) return { qaCard: "0", qaCardReads: "0", qaCardText: "", qaCardViolations: "0", qaCardHole: "0", qaCardHot: "0" };
        const c = domRect(card);
        let violations = 0;
        for (const z of zones) if (overlaps(c, pxRect(z.rect))) violations++;
        if (owner && overlaps(c, domRect(owner))) violations++;
        if (c.x0 < -0.5 || c.y0 < -0.5 || c.x1 > W() + 0.5 || c.y1 > H() + 0.5) violations++;
        // Every seat's hole cards, the hero's and every opponent's.
        let hole = 0;
        for (const a of anchors) if (overlaps(c, pxRect(holeRect(a)))) hole++;
        violations += hole;
        // Never a control: no pointer input, and the hot zones are the chips alone.
        const hot = getComputedStyle(card).pointerEvents !== "none" || qa.hotZones.length !== chipButtons().length;
        return {
          qaCard: "1",
          qaCardReads: String(card.querySelectorAll("li").length),
          qaCardText: card.textContent.replace(/"/g, "'"),
          qaCardViolations: String(violations),
          qaCardHole: String(hole),
          qaCardHot: hot ? "1" : "0",
        };
      }

      // React derives pointerenter/leave from pointerover/out and their relatedTarget.
      function enter(btn) {
        const r = btn.getBoundingClientRect();
        for (const type of ["pointerover", "mouseover"])
          btn.dispatchEvent(new (type.startsWith("pointer") ? PointerEvent : MouseEvent)(type, {
            bubbles: true, composed: true, pointerId: 1, pointerType: "mouse", isPrimary: true,
            relatedTarget: table, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2,
          }));
      }
      function leave(btn) {
        for (const type of ["pointerout", "mouseout"])
          btn.dispatchEvent(new (type.startsWith("pointer") ? PointerEvent : MouseEvent)(type, {
            bubbles: true, composed: true, pointerId: 1, pointerType: "mouse", isPrimary: true, relatedTarget: table,
          }));
      }
      const cardOpen = () => (openCard() ? 1 : 0);
      const cardText = () => openCard()?.textContent ?? "";

      function pointer(target, type, x, y) {
        target.dispatchEvent(
          new PointerEvent(type, {
            bubbles: true,
            cancelable: true,
            composed: true,
            pointerId: 1,
            pointerType: "mouse",
            isPrimary: true,
            button: type === "pointermove" ? -1 : 0,
            buttons: type === "pointerup" || type === "pointercancel" ? 0 : 1,
            clientX: x,
            clientY: y,
          }),
        );
      }

      async function runAction(action) {
        const seat = Number(params.get("seat") ?? 2);
        const dx = Number(params.get("dx") ?? 40);
        const dy = Number(params.get("dy") ?? 14);
        const btn = chipFor(seat);
        if (!btn) return `no chip for seat ${seat}`;
        const r = btn.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const settle = () => sleep(150);
        if (action === "hover") {
          enter(btn);
          await settle();
          return `card=${cardOpen()}`;
        }
        if (action === "hoverall") {
          // Every chip with reads in turn: its card opens next to it, covers
          // nothing protected, and closes when the pointer leaves.
          let opened = 0, violations = 0, hole = 0, hot = 0, stuck = 0, twoReads = 0;
          for (const b of chipButtons()) {
            const key = Number(b.parentElement.dataset.seatKey);
            if (!playerAt(key)?.engine) continue;
            enter(b);
            await settle();
            const rep = cardReport(b);
            if (rep.qaCard === "1") {
              opened++;
              violations += Number(rep.qaCardViolations);
              hole += Number(rep.qaCardHole);
              hot += Number(rep.qaCardHot);
              if (rep.qaCardReads === "2") twoReads++;
            }
            leave(b);
            await sleep(60);
            stuck += cardOpen();
          }
          return `opened=${opened} violations=${violations} hole=${hole} hot=${hot} stuck=${stuck} twoReads=${twoReads}`;
        }
        if (action === "leave") {
          enter(btn);
          await settle();
          const before = cardOpen();
          leave(btn);
          await settle();
          return `before=${before} after=${cardOpen()}`;
        }
        if (action === "nativeleave") {
          // The window turned click-through: the webview never sees the
          // pointer leave, only the native hit test's event.
          enter(btn);
          await settle();
          const before = cardOpen();
          qa.emit("overlay-pointer-left", { tableId: 2 });
          await settle();
          const otherTable = cardOpen();
          qa.emit("overlay-pointer-left", { tableId: 1 });
          await settle();
          return `before=${before} otherTable=${otherTable} after=${cardOpen()}`;
        }
        if (action === "esc") {
          enter(btn);
          await settle();
          const before = cardOpen();
          window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await settle();
          return `before=${before} after=${cardOpen()}`;
        }
        if (action === "focus") {
          btn.focus();
          await settle();
          const before = cardOpen();
          const described = btn.getAttribute("aria-describedby") === openCard()?.id ? 1 : 0;
          btn.blur();
          await settle();
          return `before=${before} described=${described} after=${cardOpen()}`;
        }
        if (action === "hoverdrag") {
          enter(btn);
          await settle();
          const before = cardOpen();
          pointer(btn, "pointerdown", cx, cy);
          for (let i = 1; i <= 6; i++) {
            pointer(btn, "pointermove", cx + (dx * i) / 6, cy + (dy * i) / 6);
            await sleep(16);
          }
          const during = cardOpen();
          // Passing over another chip mid-drag must not open its card.
          const other = chipButtons().find((b) => b !== btn && playerAt(Number(b.parentElement.dataset.seatKey))?.engine);
          if (other) enter(other);
          await settle();
          const passOver = cardOpen();
          pointer(btn, "pointerup", cx + dx, cy + dy);
          btn.click();
          await settle();
          return `before=${before} during=${during} passOver=${passOver} after=${cardOpen()} panel=${document.querySelector("aside") ? 1 : 0}`;
        }
        if (action === "hoverclick") {
          enter(btn);
          await settle();
          const before = cardOpen();
          pointer(btn, "pointerdown", cx, cy);
          pointer(btn, "pointerup", cx, cy);
          btn.click();
          await settle();
          const panel = document.querySelector("aside") ? 1 : 0;
          const after = cardOpen();
          const other = chipButtons().find((b) => b !== btn && playerAt(Number(b.parentElement.dataset.seatKey))?.engine);
          if (other) enter(other);
          await settle();
          const auto = document.querySelector("aside")?.textContent.includes("Auto") ? 1 : 0;
          return `before=${before} panel=${panel} after=${after} enterWithDrawer=${cardOpen()} autoLabel=${auto}`;
        }
        if (action === "refresh" || action === "drop" || action === "outoforder") {
          enter(btn);
          await settle();
          const before = cardOpen();
          const p = playerAt(seat);
          if (action === "refresh") {
            // A new hand changed his top read: the open card follows.
            p.engine.topReads[0] = { ...p.engine.topReads[0], observation: "Fresh read after the new hand." };
            qa.emit("hands-imported", 1);
            await sleep(300);
            return `before=${before} after=${cardOpen()} updated=${cardText().includes("Fresh read after the new hand.") ? 1 : 0}`;
          }
          if (action === "drop") {
            // He left the table: his card goes with him.
            qa.players.splice(qa.players.indexOf(p), 1);
            qa.emit("hands-imported", 1);
            await sleep(300);
            return `before=${before} after=${cardOpen()}`;
          }
          // Two refreshes; the older one's answer arrives last and must be ignored.
          qa.playerDelays.push(500, 0);
          p.engine.topReads[0] = { ...p.engine.topReads[0], observation: "Stale read from the older refresh." };
          qa.emit("hands-imported", 1);
          await sleep(20);
          p.engine.topReads[0] = { ...p.engine.topReads[0], observation: "Newest read from the latest refresh." };
          qa.emit("hands-imported", 1);
          await sleep(200);
          const mid = cardText().includes("Newest read") ? "new" : cardText().includes("Stale read") ? "stale" : "none";
          await sleep(600);
          const end = cardText().includes("Newest read") ? "new" : cardText().includes("Stale read") ? "stale" : "none";
          return `before=${before} mid=${mid} end=${end} open=${cardOpen()}`;
        }
        if (action === "click") {
          pointer(btn, "pointerdown", cx, cy);
          pointer(btn, "pointerup", cx, cy);
          btn.click();
          await sleep(200);
          if (params.get("scroll") === "end") {
            // The drawer's lower sections, for the screenshot.
            for (const el of document.querySelectorAll("aside, aside *")) el.scrollTop = el.scrollHeight;
            await sleep(50);
          }
          return `panel=${document.querySelector("aside") ? 1 : 0}`;
        }
        if (action === "external") {
          // Another overlay of this size saved seat `seat`: this one must follow.
          const key = `${qa.max}:${qa.frame}`;
          const rows = (qa.store.get(key) ?? []).filter((row) => row.seatKey !== seat);
          rows.push({ seatKey: seat, x: 0.5, y: 0.08 });
          qa.store.set(key, rows);
          qa.emit("seat-templates-changed", qa.max);
          await sleep(300);
          const n = chipFor(seat).getBoundingClientRect();
          const errX = Math.abs(n.left + n.width / 2 - 0.5 * W());
          const errY = Math.abs(n.top + n.height / 2 - 0.08 * H());
          return errX < 1.5 && errY < 1.5 ? "followed" : `off by ${errX.toFixed(1)},${errY.toFixed(1)}`;
        }
        box("ghost", { x: r.left / W(), y: r.top / H(), w: r.width / W(), h: r.height / H() });
        pointer(btn, "pointerdown", cx, cy);
        for (let i = 1; i <= 8; i++) {
          pointer(btn, "pointermove", cx + (dx * i) / 8, cy + (dy * i) / 8);
          await sleep(16);
        }
        pointer(btn, action === "cancel" ? "pointercancel" : "pointerup", cx + dx, cy + dy);
        // A drag ends in a click on the chip; it must not open the panel.
        if (action !== "cancel") btn.click();
        await sleep(300);
        const n = chipFor(seat).getBoundingClientRect();
        const moved = { x: n.left + n.width / 2 - cx, y: n.top + n.height / 2 - cy };
        return `moved=${moved.x.toFixed(1)},${moved.y.toFixed(1)} panel=${document.querySelector("aside") ? 1 : 0}`;
      }

      (async () => {
        // Wait for every player's chip, then for the measured-size relayout.
        for (let i = 0; i < 100 && chipButtons().length < qa.players.length; i++) await sleep(50);
        await sleep(300);
        const action = params.get("action");
        if (action) document.body.dataset.qaActionResult = await runAction(action);
        await sleep(100);
        measure();
        document.body.dataset.qaReady = "1";
      })();
    </script>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
